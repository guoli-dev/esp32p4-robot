# Custom OpenOCD config for ESP32-P4 builtin USB-JTAG

source [find interface/esp_usb_jtag.cfg]
transport select jtag
# Start with very low speed (500 KHz) for stable JTAG init
adapter speed 500

# Only use CPU0 for more reliable connection (CPU1 often fails examination)
set _ONLYCPU 0x01
source [find target/esp32p4.cfg]

# Boost clock after successful examine
$_TARGETNAME_0 configure -event examine-end {
    adapter speed 5000
    arm semihosting enable
    arm semihosting_resexit enable
    if { [info exists _SEMIHOST_BASEDIR] } {
        if { $_SEMIHOST_BASEDIR != "" } {
            arm semihosting_basedir $_SEMIHOST_BASEDIR
        }
    }
}
